name: vpay_flutter
description: "VPay - Voice-based payment Flutter app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Routing
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.0

  # DI
  get_it: ^7.6.7

  # Auth
  supabase_flutter: ^2.3.4

  # QR
  mobile_scanner: ^4.0.1

  # Audio
  record: ^6.0.0
  permission_handler: ^11.3.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0

  # Models/Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Local storage
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
